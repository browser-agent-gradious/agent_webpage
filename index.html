<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Browser Agent UI</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            background: #1e1e1e;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin-bottom: 1.5rem;
            color: #00d1b2;
        }

        input {
            width: 80%;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            border: none;
            background: #333;
            color: white;
            text-align: center;
        }

        .mic-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            background: #ff3860;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 0 auto 20px;
        }

        .mic-button:active {
            transform: scale(0.9);
        }

        .mic-button.recording {
            background: #00d1b2;
            box-shadow: 0 0 20px #00d1b2;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        #status {
            font-weight: bold;
            margin-bottom: 20px;
            color: #bbb;
        }

        #logs {
            width: 100%;
            height: 200px;
            background: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            padding: 10px;
            border-radius: 5px;
            overflow-y: auto;
            text-align: left;
            font-size: 0.85rem;
            box-sizing: border-box;
        }

        /* ── PiP Button ─────────────────────────────── */
        .pip-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 18px;
            padding: 9px 20px;
            border-radius: 8px;
            border: none;
            background: #2a2a2a;
            color: #00d1b2;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
            letter-spacing: 0.03em;
        }

        .pip-button:hover {
            background: #333;
            box-shadow: 0 0 10px rgba(0, 209, 178, 0.25);
        }

        .pip-button svg {
            flex-shrink: 0;
        }

        #pipNotice {
            display: none;
            margin-top: 10px;
            font-size: 0.78rem;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="container" id="mainContainer">
        <h1>Voice Agent Console</h1>
        <input type="text" id="sessionId" placeholder="Paste Session ID here...">
        <button id="micBtn" class="mic-button">
            <svg fill="white" height="40" viewBox="0 0 24 24" width="40">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" />
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
            </svg>
        </button>
        <div id="status">Click or hold Space to speak</div>
        <div id="logs">
            <div>[System] Ready for voice commands...</div>
        </div>

        <!-- PiP controls -->
        <button class="pip-button" id="pipBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2"/>
                <rect x="12" y="11" width="9" height="6" rx="1" fill="currentColor" stroke="none"/>
            </svg>
            Pop Out to Picture-in-Picture
        </button>
        <div id="pipNotice">⚠️ Your browser doesn't support the Document Picture-in-Picture API.<br>Try Chrome 116+ or Edge 116+.</div>
    </div>

    <script>
        const sessionIdInput = document.getElementById('sessionId');
        const micBtn         = document.getElementById('micBtn');
        const statusText     = document.getElementById('status');
        const logs           = document.getElementById('logs');
        const pipBtn         = document.getElementById('pipBtn');
        const pipNotice      = document.getElementById('pipNotice');

        let socket;
        let mediaRecorder;
        let audioChunks  = [];
        let activeStream = null;

        // --- Mode tracking ---
        let mode      = 'idle';
        let spaceHeld = false;

        // ─── WebSocket ───────────────────────────────────────────────────────────
        function connect() {
            socket = new WebSocket('ws://localhost:8000/ws/voice');
            socket.onopen  = () => addLog("[System] Connected to Backend WebSocket");
            socket.onclose = () => { addLog("[System] Disconnected. Retrying..."); setTimeout(connect, 2000); };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'ack') {
                    addLog(`[Heard You] "${data.transcript}"`);
                    statusText.textContent = "Executing...";
                }
                if (data.type === 'result') {
                    addLog(`[Action] ${data.summary} (${data.intent})`);
                    statusText.textContent = "Click or hold Space to speak";
                }
                if (data.type === 'error') {
                    addLog(`[Error] ${data.detail}`);
                    statusText.textContent = "Click or hold Space to speak";
                }
            };
        }

        function addLog(msg) {
            const div = document.createElement('div');
            div.textContent = `> ${msg}`;
            logs.appendChild(div);
            logs.scrollTop = logs.scrollHeight;
        }

        // ─── Core recording helpers ──────────────────────────────────────────────
        async function startRecording(trigger) {
            if (mode !== 'idle') return;
            if (!sessionIdInput.value) { alert("Please paste a Session ID first!"); return; }

            socket.send(JSON.stringify({ type: 'init', session_id: sessionIdInput.value }));

            try {
                activeStream  = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(activeStream, { mimeType: 'audio/webm' });
                audioChunks   = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    addLog(`[System] Captured ${audioBlob.size} bytes of audio.`);

                    if (audioBlob.size > 0 && socket.readyState === WebSocket.OPEN) {
                        socket.send(audioBlob);
                        addLog(`[System] Audio sent to Groq for processing...`);
                        statusText.textContent = "Transcribing...";
                    } else {
                        addLog("[Error] Failed to send: Audio was empty.");
                        statusText.textContent = "Click or hold Space to speak";
                    }

                    if (activeStream) {
                        activeStream.getTracks().forEach(track => track.stop());
                        activeStream = null;
                    }
                };

                mediaRecorder.start();
                mode = trigger; // 'click-latch' or 'space-hold'
                micBtn.classList.add('recording');

                if (trigger === 'click-latch') {
                    statusText.textContent = "Recording... (Click to stop)";
                } else {
                    statusText.textContent = "Recording... (Release Space to send)";
                }
            } catch (err) {
                addLog(`[Error] Mic access denied: ${err.message}`);
                mode = 'idle';
            }
        }

        function stopRecording() {
            if (mode === 'idle') return;
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            mode = 'idle';
            micBtn.classList.remove('recording');
        }

        // ─── Click: toggle latch ─────────────────────────────────────────────────
        micBtn.addEventListener('click', () => {
            if (mode === 'idle') {
                startRecording('click-latch');
            } else if (mode === 'click-latch') {
                // Clicked again while latched → stop
                stopRecording();
            }
            // If space-hold is active, click does nothing — space controls it
        });

        // ─── Spacebar: push-to-talk ──────────────────────────────────────────────
        // Registers on whichever document is active (main or PiP window)
        function registerSpaceListeners(doc) {
            doc.addEventListener('keydown', (e) => {
                if (doc.activeElement === sessionIdInput) return;
                if (e.code !== 'Space' || spaceHeld) return;
                e.preventDefault();
                spaceHeld = true;
                if (mode === 'idle') startRecording('space-hold');
            });

            doc.addEventListener('keyup', (e) => {
                if (e.code !== 'Space') return;
                e.preventDefault();
                spaceHeld = false;
                if (mode === 'space-hold') stopRecording();
            });
        }

        registerSpaceListeners(document);

        // ─── Document Picture-in-Picture ─────────────────────────────────────────
        let pipWindow = null;

        if (!('documentPictureInPicture' in window)) {
            // API not supported — show notice, hide button
            pipBtn.style.display  = 'none';
            pipNotice.style.display = 'block';
        }

        pipBtn.addEventListener('click', async () => {
            // If already in PiP, close it
            if (pipWindow && !pipWindow.closed) {
                pipWindow.close();
                return;
            }

            try {
                // Open the Document PiP window (small floating window)
                pipWindow = await window.documentPictureInPicture.requestWindow({
                    width:  320,
                    height: 320,
                });

                // ── Copy all stylesheets into the PiP document ──────────────────
                [...document.styleSheets].forEach((sheet) => {
                    try {
                        const cssRules = [...sheet.cssRules].map(r => r.cssText).join('');
                        const style    = pipWindow.document.createElement('style');
                        style.textContent = cssRules;
                        pipWindow.document.head.appendChild(style);
                    } catch (_) {
                        // Cross-origin sheets — link instead
                        if (sheet.href) {
                            const link = pipWindow.document.createElement('link');
                            link.rel  = 'stylesheet';
                            link.href = sheet.href;
                            pipWindow.document.head.appendChild(link);
                        }
                    }
                });

                // ── Extra compact styles for the small PiP viewport ─────────────
                const compactStyle = pipWindow.document.createElement('style');
                compactStyle.textContent = `
                    body {
                        background: #121212;
                        color: white;
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        justify-content: flex-start;
                        height: 100vh;
                        margin: 0;
                        overflow: hidden;
                        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                    }
                    .container {
                        width: 95%;
                        max-width: 100%;
                        background: #1e1e1e;
                        border-radius: 12px;
                        padding: 1rem;
                        margin-top: 10px;
                        box-shadow: 0 6px 20px rgba(0,0,0,0.5);
                        text-align: center;
                    }
                    h1 { font-size: 1rem; margin: 0 0 0.6rem; color: #00d1b2; }
                    input {
                        width: 85%;
                        padding: 6px;
                        margin-bottom: 10px;
                        border-radius: 5px;
                        border: none;
                        background: #333;
                        color: white;
                        text-align: center;
                        font-size: 0.8rem;
                    }
                    .mic-button {
                        width: 70px;
                        height: 70px;
                        border-radius: 50%;
                        border: none;
                        background: #ff3860;
                        cursor: pointer;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        transition: transform 0.2s, box-shadow 0.2s;
                        margin: 0 auto 10px;
                    }
                    .mic-button.recording {
                        background: #00d1b2;
                        box-shadow: 0 0 16px #00d1b2;
                        animation: pulse 1.5s infinite;
                    }
                    @keyframes pulse {
                        0%   { transform: scale(1); }
                        50%  { transform: scale(1.1); }
                        100% { transform: scale(1); }
                    }
                    #status { font-weight: bold; margin-bottom: 8px; color: #bbb; font-size: 0.82rem; }
                    #logs {
                        width: 100%;
                        height: 120px;
                        background: #000;
                        color: #0f0;
                        font-family: 'Courier New', monospace;
                        padding: 8px;
                        border-radius: 5px;
                        overflow-y: auto;
                        text-align: left;
                        font-size: 0.75rem;
                        box-sizing: border-box;
                    }
                    .pip-button { display: none; }
                `;
                pipWindow.document.head.appendChild(compactStyle);

                // ── Move the UI container into the PiP window ───────────────────
                const container = document.getElementById('mainContainer');
                pipWindow.document.body.appendChild(container);

                // Register space-bar push-to-talk in the PiP window too
                registerSpaceListeners(pipWindow.document);

                // Update button label
                pipBtn.textContent = '⬛ Close Picture-in-Picture';

                // ── When PiP closes, move the container back ────────────────────
                pipWindow.addEventListener('pagehide', () => {
                    document.body.appendChild(container);
                    pipBtn.innerHTML = `
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="3" width="20" height="14" rx="2"/>
                            <rect x="12" y="11" width="9" height="6" rx="1" fill="currentColor" stroke="none"/>
                        </svg>
                        Pop Out to Picture-in-Picture`;
                    pipWindow = null;
                });

            } catch (err) {
                addLog(`[PiP Error] ${err.message}`);
                console.error('Document PiP error:', err);
            }
        });

        connect();
    </script>
</body>

</html>
